<svg xmlns="http://www.w3.org/2000/svg" width="440" height="55" viewBox="0 0 440 55" role="img" aria-labelledby="title desc">
  <title id="title">Compliance certifications banner</title>
  <desc id="desc">Lightweight partner compliance banner highlighting GDPR, CCPA, and SEC readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9372ff"/>
      <stop offset="100%" stop-color="#f84eea"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="438" height="53" rx="14" fill="url(#bg)" stroke="#334155"/>

  <g transform="translate(18 12)">
    <rect width="28" height="28" rx="9" fill="url(#accent)"/>
    <path d="M8 15.2l4.2 4.1L20.8 9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="58" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">
    Compliance-ready infrastructure
  </text>
  <text x="58" y="39" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="10.5">
    Regulated data ops with strong governance.
  </text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700">
    <rect x="284" y="12" width="46" height="30" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#475569"/>
    <text x="307" y="31" text-anchor="middle" fill="#ffffff">GDPR</text>

    <rect x="338" y="12" width="46" height="30" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#475569"/>
    <text x="361" y="31" text-anchor="middle" fill="#ffffff">CCPA</text>

    <rect x="392" y="12" width="38" height="30" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#475569"/>
    <text x="411" y="31" text-anchor="middle" fill="#ffffff">SEC</text>
  </g>
</svg>
